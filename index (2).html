<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SevenPro — CV Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.js"></script>
<script src="https://unpkg.com/docxtemplater@3.45.1/build/docxtemplater.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --red:#C0392B;--purple:#6B3FA0;--dark:#1A1A1A;--gray:#666;
  --border:#E8E8E8;--bg:#F7F6F4;--card:#fff;
  --font:'DM Sans',system-ui,sans-serif;--mono:'DM Mono',monospace;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--dark);font-size:14px;}
.app{display:grid;grid-template-rows:56px 1fr;height:100vh;}
.topbar{background:var(--dark);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:16px;z-index:10;}
.topbar-logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;color:#fff;letter-spacing:-.01em;}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--red);}
.topbar-sep{opacity:.25;margin:0 4px;}
.topbar-actions{display:flex;gap:10px;}
.panels{display:grid;grid-template-columns:490px 1fr;overflow:hidden;}
.form-panel{overflow-y:auto;border-right:1px solid var(--border);}
.preview-panel{overflow-y:auto;background:#E9E8E6;padding:28px 24px;display:flex;flex-direction:column;align-items:center;}
.preview-label{font-size:11px;color:#999;letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px;font-family:var(--mono);}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:opacity .15s,transform .1s;}
.btn:active{transform:scale(.97);}
.btn:hover{opacity:.85;}
.btn-primary{background:var(--red);color:#fff;}
.btn-secondary{background:rgba(255,255,255,.12);color:#fff;}
.btn-outline{background:transparent;color:var(--dark);border:1px solid var(--border);font-size:12px;padding:6px 12px;}
.btn-ghost{background:transparent;color:var(--gray);border:1px solid transparent;font-size:12px;padding:6px 10px;}
.btn-ghost:hover{border-color:var(--border);color:var(--dark);}
.btn-danger{background:#FFF0EE;color:var(--red);border:1px solid #FDDBD7;font-size:12px;padding:6px 12px;}
.btn-add{background:var(--bg);color:var(--purple);border:1.5px dashed #C4B5D9;font-size:13px;width:100%;padding:10px;border-radius:8px;margin-top:8px;cursor:pointer;font-family:var(--font);}
.btn-add:hover{background:#F0EBF9;}
.form-inner{padding:20px 20px 48px;display:flex;flex-direction:column;gap:6px;}
.section-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;cursor:pointer;user-select:none;transition:background .1s;}
.section-head:hover{background:#FAFAFA;}
.s-head-left{display:flex;align-items:center;gap:10px;}
.s-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.ic-red{background:#FFF0EE;} .ic-blue{background:#EBF2FF;} .ic-purple{background:#F0EBF9;}
.ic-green{background:#EDFDF4;} .ic-amber{background:#FFF9EB;} .ic-gray{background:#F5F5F5;}
.s-title{font-size:13px;font-weight:600;color:var(--dark);}
.s-chev{color:#BBB;font-size:10px;transition:transform .2s;}
.s-chev.open{transform:rotate(180deg);}
.s-body{padding:0 14px 14px;display:none;flex-direction:column;gap:11px;}
.s-body.open{display:flex;}
.row{display:flex;gap:10px;}
.field{display:flex;flex-direction:column;gap:4px;flex:1;}
label{font-size:11.5px;font-weight:500;color:#555;letter-spacing:.01em;}
input[type=text],textarea,select{background:#FAFAFA;border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-family:var(--font);font-size:13px;color:var(--dark);outline:none;width:100%;transition:border-color .15s,box-shadow .15s;}
input:focus,textarea:focus{border-color:var(--purple);background:#fff;box-shadow:0 0 0 3px rgba(107,63,160,.1);}
textarea{resize:vertical;min-height:66px;line-height:1.5;}
.hint{font-size:11px;color:#AAA;margin-top:1px;}
.tags-wrap{background:#FAFAFA;border:1px solid var(--border);border-radius:6px;padding:5px 8px;min-height:38px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;cursor:text;transition:border-color .15s;}
.tags-wrap:focus-within{border-color:var(--purple);background:#fff;box-shadow:0 0 0 3px rgba(107,63,160,.1);}
.tag{background:#EDE8F5;color:var(--purple);border-radius:4px;padding:2px 7px 2px 8px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:4px;}
.tag-x{cursor:pointer;color:#A78BCC;font-size:13px;line-height:1;border:none;background:none;padding:0;}
.tag-x:hover{color:var(--red);}
.tags-input{border:none;background:transparent;outline:none;font-family:var(--font);font-size:13px;color:var(--dark);min-width:80px;flex:1;padding:2px 0;}
.exp-card{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:6px;}
.exp-head{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:#FAFAFA;cursor:pointer;font-size:13px;font-weight:500;color:#444;user-select:none;}
.exp-num{width:22px;height:22px;background:var(--purple);color:#fff;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;}
.exp-body{padding:12px;display:none;flex-direction:column;gap:9px;}
.exp-body.open{display:flex;}
.resp-list{display:flex;flex-direction:column;gap:5px;}
.resp-item{display:flex;gap:6px;align-items:center;}
.resp-item input{flex:1;}
/* CV Preview */
.cv-page{width:780px;background:#fff;box-shadow:0 2px 40px rgba(0,0,0,.18);border-radius:2px;font-family:Arial,sans-serif;font-size:10.5pt;line-height:1.4;color:#1A1A1A;}
.cv-hdr{position:relative;overflow:hidden;height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 38px;}
.cv-hdr-bg{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0;}
.cv-hdr-name{position:relative;z-index:1;}
.cv-hdr-name h1{font-size:15pt;font-weight:700;color:#1A1A1A;margin:0;}
.cv-hdr-name p{font-size:10pt;color:#666;margin:2px 0 0;}
.cv-hdr-logo{position:relative;z-index:1;}
.cv-hdr-logo img{height:22px;}
.cv-hdr-line{border:none;border-bottom:1.5px solid #E0E0E0;margin:0 38px;}
.cv-body{padding:18px 38px 24px;}
.cv-sec{margin-bottom:16px;}
.cv-sec-title{display:flex;align-items:center;gap:5px;font-size:13.5pt;font-weight:700;color:#1A1A1A;margin-bottom:10px;}
.cv-dash{color:#C0392B;}
.cv-div{border:none;border-bottom:1px solid #E0E0E0;margin:14px 0;}
.cv-cap{font-size:7.5pt;font-weight:700;color:#999;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;}
.cv-text{font-size:10pt;color:#1A1A1A;margin-bottom:6px;}
.cv-company{font-size:11.5pt;font-weight:700;color:#6B3FA0;border-left:3px solid #C0392B;padding-left:9px;}
.cv-role{font-size:9.5pt;color:#666;font-style:italic;padding-left:12px;margin-bottom:8px;}
.cv-date{font-size:9.5pt;color:#666;}
.cv-exp-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:3px;}
.cv-tech{background:#F2F2F2;border:1px solid #DEDEDE;border-radius:2px;padding:5px 9px;font-size:9pt;color:#555;margin-bottom:7px;line-height:1.6;}
.cv-desc{font-size:9.5pt;color:#1A1A1A;border-left:2.5px solid #C0392B;padding-left:9px;margin-bottom:7px;}
.cv-ul{margin:0 0 0 16px;padding:0;}
.cv-ul li{font-size:9.5pt;margin-bottom:3px;list-style:disc;}
.cv-exp-block{margin-bottom:14px;}
.cv-edu-name{font-size:10pt;font-weight:700;margin-bottom:1px;}
.cv-edu-meta{font-size:9pt;color:#666;margin-bottom:1px;}
.cv-ftr{border-top:1px solid #E0E0E0;padding:9px 38px;display:flex;justify-content:space-between;font-size:8pt;color:#666;}
/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:#1A1A1A;color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;z-index:999;}
.toast.show{opacity:1;transform:translateY(0);}
::-webkit-scrollbar{width:4px;} ::-webkit-scrollbar-thumb{background:#D0D0D0;border-radius:99px;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-logo">
      <div class="logo-dot"></div>
      SevenPro <span class="topbar-sep">/</span> CV Generator
    </div>
    <div class="topbar-actions">
      <button class="btn btn-secondary" onclick="generatePdf()">&#8595; PDF</button>
      <button class="btn btn-primary"   onclick="generateDocx()">&#8595; DOCX</button>
    </div>
  </div>
  <div class="panels">
    <div class="form-panel"><div class="form-inner" id="formInner"></div></div>
    <div class="preview-panel">
      <div class="preview-label">Live Preview</div>
      <div id="cvPreview"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

const ge = id => document.getElementById(id);

// ── Tag Input ─────────────────────────────────────────────────────────────────
function renderTags(container, tags, onChange) {
  container.innerHTML='';
  tags.forEach((tag,i)=>{
    const s=document.createElement('span'); s.className='tag';
    s.innerHTML=esc(tag)+`<button class="tag-x" data-i="${i}">×</button>`;
    s.querySelector('.tag-x').onclick=ev=>{ev.stopPropagation();tags.splice(i,1);onChange(tags);renderTags(container,tags,onChange);};
    container.appendChild(s);
  });
  const inp=document.createElement('input'); inp.className='tags-input'; inp.placeholder='Type & press Enter or ,';
  inp.onkeydown=ev=>{
    if((ev.key==='Enter'||ev.key===',')&&inp.value.trim()){
      ev.preventDefault(); const v=inp.value.replace(/,$/,'').trim();
      if(v){tags.push(v);onChange(tags);renderTags(container,tags,onChange);}
    }
    if(ev.key==='Backspace'&&!inp.value&&tags.length){tags.pop();onChange(tags);renderTags(container,tags,onChange);}
  };
  inp.onblur=()=>{ const v=inp.value.replace(/,$/,'').trim(); if(v){tags.push(v);onChange(tags);renderTags(container,tags,onChange);}};
  container.appendChild(inp);
  container.onclick=()=>inp.focus();
}

// ── Section toggle ────────────────────────────────────────────────────────────
function toggleSec(id){
  const b=ge(id+'_body'),c=ge(id+'_chev');
  b.classList.toggle('open'); if(c)c.classList.toggle('open');
}

// ── Section builder ───────────────────────────────────────────────────────────
function mkSection(id,icon,ic,title,open,bodyHtml){
  const d=document.createElement('div'); d.className='section-card';
  d.innerHTML=`
    <div class="section-head" onclick="toggleSec('${id}')">
      <div class="s-head-left">
        <div class="s-icon ${ic}">${icon}</div>
        <span class="s-title">${title}</span>
      </div>
      <span class="s-chev ${open?'open':''}" id="${id}_chev">▼</span>
    </div>
    <div class="s-body ${open?'open':''}" id="${id}_body">${bodyHtml}</div>`;
  return d;
}

function buildExpHtml(){
  let h='';
  state.experiences.forEach((exp,i)=>{
    const lbl=exp.company||`Experience ${i+1}`;

    h+=`<div class="exp-card" id="ec_${i}">
      <div class="exp-head" onclick="toggleExp(${i})">

          <span class="exp-num">${i+1}</span>

// ── Toggle/actions ────────────────────────────────────────────────────────────
function toggleExp(i){const b=ge(`eb_${i}`),c=ge(`echev_${i}`);b.classList.toggle('open');if(c)c.textContent=b.classList.contains('open')?'▲':'▼';}
function rebuildSec(id,html){const b=ge(id+'_body');if(b)b.innerHTML=html;}
function initTechTags(){state.experiences.forEach((_,i)=>{const w=ge(`tw_${i}`);if(w)renderTags(w,state.experiences[i].technologies,t=>{state.experiences[i].technologies=t;updatePreview();});});}

function addExp(){state.experiences.push({company:'',role:'',dateRange:'',description:'',technologies:[],responsibilities:['']});rebuildSec('exp',buildExpHtml());initTechTags();updatePreview();}
function rmExp(ev,i){ev.stopPropagation();if(state.experiences.length<=1)return;state.experiences.splice(i,1);rebuildSec('exp',buildExpHtml());initTechTags();updatePreview();}
function addResp(i){state.experiences[i].responsibilities.push('');rebuildSec('exp',buildExpHtml());initTechTags();updatePreview();}
function removeResp(i,ri){state.experiences[i].responsibilities.splice(ri,1);rebuildSec('exp',buildExpHtml());initTechTags();updatePreview();}

function addEdu(){state.education.push({school:'',period:'',degree:''});rebuildSec('edu',buildEduHtml());updatePreview();}
function rmEdu(i){state.education.splice(i,1);rebuildSec('edu',buildEduHtml());updatePreview();}
function addCert(){state.certifications.push({certName:'',year:''});rebuildSec('cert',buildCertHtml());updatePreview();}
function rmCert(i){state.certifications.splice(i,1);rebuildSec('cert',buildCertHtml());updatePreview();}
function addLang(){state.languages.push({language:'',level:''});rebuildSec('lang',buildLangHtml());updatePreview();}
function rmLang(i){state.languages.splice(i,1);rebuildSec('lang',buildLangHtml());updatePreview();}

// ── Generate DOCX ──────────────────────────────────────────────────────────────
async function generateDocx(){
  try{
    showToast('⏳ Generating DOCX…');
    const s=state, dot=arr=>(arr||[]).join('  ·  ');
    const data={
      candidateName: s.name||'',
      position:      s.position||'',
      recruitmentFeedback: s.recruitmentFeedback||'',
      technicalFeedback:   s.technicalFeedback||'',
      skillGroups: s.technicalSkills.length ? [{label:'Technical Skills', items:dot(s.technicalSkills)}] : [{label:'Technical Skills',items:'—'}],
      experiences: s.experiences.map(e=>({
        company:e.company||'', role:e.role||'', dateRange:e.dateRange||'',
        description:e.description||'', technologies:dot(e.technologies),
        responsibilities:(e.responsibilities||[]).filter(r=>r.trim())
      })),
      education:     s.education.map(e=>({school:e.school||'',period:e.period||'',degree:e.degree||''})),
      certifications:s.certifications.map(c=>({certName:c.certName||'',year:c.year||''})),
      languages:     s.languages.map(l=>({language:l.language||'',level:l.level||''}))
    };
    const bin=atob(TEMPLATE_B64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const zip=new PizZip(bytes.buffer);
    const doc=new Docxtemplater(zip,{paragraphLoop:true,linebreaks:true});
    doc.render(data);
    const blob=doc.getZip().generate({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=(s.name||'CV')+'.docx'; a.click();
    URL.revokeObjectURL(url);
    showToast('✅ DOCX downloaded!');
  }catch(err){console.error(err);showToast('❌ Error: '+err.message);}
}

// ── Generate PDF ───────────────────────────────────────────────────────────────
function generatePdf(){
  const el=ge('cvPreview').firstElementChild;
  if(!el){showToast('Fill in the form first');return;}
  showToast('⏳ Generating PDF…');
  html2pdf().set({
    margin:0, filename:(state.name||'CV')+'.pdf',
    image:{type:'jpeg',quality:.98},
    html2canvas:{scale:2,useCORS:true},
    jsPDF:{unit:'px',format:[780,1103],orientation:'portrait'}
  }).from(el).save().then(()=>showToast('✅ PDF downloaded!'));
}
