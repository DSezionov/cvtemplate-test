<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SevenPro — CV Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.js"></script>
<script src="https://unpkg.com/docxtemplater@3.45.1/build/docxtemplater.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
/* ── Reset & tokens ──────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --red:#EF4A37; --purple:#6B3FA0; --dark:#1A1A1A;
  --gray:#666; --border:#E8E8E8; --bg:#F4F3F1; --card:#fff;
  --f:'Montserrat',system-ui,sans-serif;
}
html,body{height:100%;font-family:var(--f);background:var(--bg);color:var(--dark);
  font-size:14px;-webkit-font-smoothing:antialiased;}

/* ── Layout shell ────────────────────────────────────────────────────────── */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.topbar{background:var(--dark);display:flex;align-items:center;padding:0 20px;
  height:52px;flex-shrink:0;gap:14px;}
.tb-logo img{height:24px;display:block;filter:brightness(0) invert(1);}
.tb-sep{width:1px;height:18px;background:rgba(255,255,255,.2);}
.tb-title{font-size:12px;font-weight:500;color:rgba(255,255,255,.4);letter-spacing:.05em;}
.tb-actions{margin-left:auto;display:flex;gap:8px;}
.panels{display:flex;flex:1;overflow:hidden;}
.lpanel{width:460px;flex-shrink:0;overflow-y:auto;border-right:1px solid var(--border);}
.rpanel{flex:1;overflow-y:auto;background:#DDDBD8;padding:24px 16px;
  display:flex;flex-direction:column;align-items:center;}
.preview-lbl{font-size:10px;font-weight:600;color:#999;letter-spacing:.12em;
  text-transform:uppercase;margin-bottom:14px;}

/* ── Buttons ─────────────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 15px;
  border-radius:6px;font-family:var(--f);font-size:12px;font-weight:600;
  cursor:pointer;border:none;transition:opacity .15s,transform .1s;
  white-space:nowrap;letter-spacing:.01em;}
.btn:active{transform:scale(.97);} .btn:hover{opacity:.85;}
.btn-primary{background:var(--red);color:#fff;}
.btn-secondary{background:rgba(255,255,255,.1);color:rgba(255,255,255,.85);
  border:1px solid rgba(255,255,255,.12);}
.btn-secondary:hover{background:rgba(255,255,255,.16);opacity:1;}
.btn-outline{background:transparent;color:var(--dark);border:1px solid var(--border);
  font-size:11px;padding:5px 11px;}
.btn-ghost{background:transparent;color:var(--gray);font-size:11px;padding:5px 9px;
  border:1px solid transparent;}
.btn-ghost:hover{border-color:var(--border);color:var(--dark);}
.btn-danger{background:#FFF0EE;color:#C0392B;border:1px solid #FDDBD7;
  font-size:11px;padding:5px 11px;}
.btn-add{background:var(--bg);color:var(--purple);border:1.5px dashed #C4B5D9;
  font-size:12px;width:100%;padding:9px;border-radius:8px;margin-top:6px;
  cursor:pointer;font-family:var(--f);font-weight:600;transition:background .15s;}
.btn-add:hover{background:#F0EBF9;}
.btn-mob{display:none;}

/* ── Form ────────────────────────────────────────────────────────────────── */
.form-inner{padding:14px 14px 60px;display:flex;flex-direction:column;gap:5px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.card-head{display:flex;align-items:center;justify-content:space-between;
  padding:10px 13px;cursor:pointer;user-select:none;}
.card-head:hover{background:#FAFAFA;}
.ch-l{display:flex;align-items:center;gap:9px;}
.ch-icon{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;font-size:12px;flex-shrink:0;}
.ic-r{background:#FFF0EE;} .ic-b{background:#EBF2FF;} .ic-p{background:#F0EBF9;}
.ic-g{background:#EDFDF4;} .ic-a{background:#FFF9EB;} .ic-gr{background:#F5F5F5;}
.ch-title{font-size:13px;font-weight:600;}
.ch-arr{color:#CCC;font-size:9px;transition:transform .2s;}
.ch-arr.open{transform:rotate(180deg);}
.card-body{padding:0 13px 13px;display:none;flex-direction:column;gap:10px;}
.card-body.open{display:flex;}
.row{display:flex;gap:9px;}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0;}
label{font-size:11px;font-weight:500;color:#555;}
input[type=text],textarea{background:#FAFAFA;border:1px solid var(--border);
  border-radius:6px;padding:7px 10px;font-family:var(--f);font-size:12px;
  color:var(--dark);outline:none;width:100%;transition:border-color .15s;}
input:focus,textarea:focus{border-color:var(--purple);background:#fff;
  box-shadow:0 0 0 3px rgba(107,63,160,.1);}
textarea{resize:vertical;min-height:62px;line-height:1.5;}
.hint{font-size:10px;color:#AAA;margin-top:1px;}

/* Tags */
.tw{background:#FAFAFA;border:1px solid var(--border);border-radius:6px;
  padding:5px 7px;min-height:36px;display:flex;flex-wrap:wrap;gap:4px;
  align-items:center;cursor:text;transition:border-color .15s;}
.tw:focus-within{border-color:var(--purple);background:#fff;
  box-shadow:0 0 0 3px rgba(107,63,160,.1);}
.tag{background:#EDE8F5;color:var(--purple);border-radius:4px;
  padding:2px 6px 2px 8px;font-size:11px;font-weight:500;
  display:inline-flex;align-items:center;gap:3px;}
.tx{cursor:pointer;color:#A78BCC;font-size:12px;border:none;
  background:none;padding:0;line-height:1;}
.tx:hover{color:#C0392B;}
.tinp{border:none;background:transparent;outline:none;font-family:var(--f);
  font-size:12px;color:var(--dark);min-width:60px;flex:1;padding:1px 0;}

/* Exp sub-cards */
.ec{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:5px;}
.ec-h{display:flex;align-items:center;justify-content:space-between;
  padding:8px 11px;background:#FAFAFA;cursor:pointer;
  font-size:12px;font-weight:600;color:#444;user-select:none;}
.ec-n{width:20px;height:20px;background:var(--purple);color:#fff;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;flex-shrink:0;}
.ec-b{padding:11px;display:none;flex-direction:column;gap:8px;}
.ec-b.open{display:flex;}
.rl{display:flex;flex-direction:column;gap:4px;}
.ri{display:flex;gap:5px;align-items:center;}
.ri input{flex:1;}

/* ── CV Preview ──────────────────────────────────────────────────────────── */
.cv{width:720px;background:#fff;box-shadow:0 4px 32px rgba(0,0,0,.2);
  border-radius:1px;font-family:var(--f);font-size:10pt;line-height:1.45;
  color:#1A1A1A;}
.cv-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:18px 36px 14px;border-bottom:1.5px solid #E8E8E8;}
.cv-hdr-name h1{font-size:15pt;font-weight:700;color:#1A1A1A;margin:0 0 3px;}
.cv-hdr-name p{font-size:9.5pt;color:#666;margin:0;font-weight:400;}
.cv-hdr-logo img{height:28px;width:auto;display:block;}
.cv-body{padding:18px 36px 28px;}
.cv-sec{margin-bottom:18px;}
.cv-sec-title{font-size:13.5pt;font-weight:700;color:#1A1A1A;
  margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #EBEBEB;}
.cv-label{font-size:11px;font-weight:700;color:#1A1A1A;margin-bottom:1px;}
.cv-text{font-size:9.5pt;color:#434343;line-height:1.55;margin-bottom:6px;}
.cv-meta{font-size:9pt;color:#666;margin-bottom:3px;}
.cv-company{font-size:11pt;font-weight:700;color:#6B3FA0;}
.cv-role{font-size:9pt;color:#666;font-style:italic;margin:1px 0 8px;}
.cv-date{font-size:9pt;color:#999;white-space:nowrap;}
.cv-exp-row{display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:2px;gap:12px;}
.cv-cap{font-size:7.5pt;font-weight:700;color:#999;letter-spacing:.08em;
  text-transform:uppercase;margin:7px 0 3px;}
.cv-tech{background:#F2F2F2;border:1px solid #DEDEDE;padding:5px 10px;
  font-size:8.5pt;color:#555;line-height:1.6;margin-bottom:6px;}
.cv-ul{margin:3px 0 0 16px;padding:0;}
.cv-ul li{font-size:9pt;margin-bottom:2px;list-style:disc;color:#434343;}
.cv-exp-block{padding-bottom:12px;margin-bottom:12px;
  border-bottom:1px solid #F2F2F2;}
.cv-exp-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.cv-divider{border:none;border-bottom:1px solid #E8E8E8;margin:4px 0 16px;}
.cv-ftr{border-top:1px solid #E8E8E8;padding:8px 36px;
  display:flex;justify-content:space-between;font-size:7.5pt;color:#999;}

/* ── Toast ───────────────────────────────────────────────────────────────── */
.toast{position:fixed;bottom:20px;right:20px;background:#1A1A1A;color:#fff;
  padding:10px 16px;border-radius:8px;font-size:12px;font-family:var(--f);
  opacity:0;transform:translateY(6px);transition:all .2s;
  pointer-events:none;z-index:999;max-width:280px;}
.toast.show{opacity:1;transform:translateY(0);}

/* ── Scrollbar ───────────────────────────────────────────────────────────── */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:#D0D0D0;border-radius:99px;}

/* ── Mobile ──────────────────────────────────────────────────────────────── */
@media(max-width:860px){
  .app{height:auto;min-height:100vh;overflow:visible;}
  .panels{flex-direction:column;overflow:visible;}
  .lpanel{width:100%;border-right:none;border-bottom:1px solid var(--border);}
  .rpanel{display:none;padding:12px 8px;}
  .rpanel.mob-show{display:flex;}
  .topbar{position:sticky;top:0;z-index:100;}
  .tb-sep,.tb-title{display:none;}
  .btn-mob{display:inline-flex!important;}
  .cv{width:100%;font-size:8.5pt;}
  .cv-hdr{padding:12px 14px 10px;}
  .cv-body{padding:12px 14px 18px;}
  .cv-ftr{padding:7px 14px;}
}
</style>
</head>

// ═══════════════════════════════════════════════════════════════════════════
//  DOCX GENERATION
// ═══════════════════════════════════════════════════════════════════════════

function collectDocxData() {
  const dot = a => (a||[]).filter(Boolean).join(' · ');
  return {
    candidateName:     state.name || '',
    position:          state.position || '',
    recruitmentFeedback: state.recruitmentFeedback || '',
    technicalFeedback:   state.technicalFeedback   || '',
    skillGroups: state.technicalSkills.length
      ? [{label:'Technical Skills', items: dot(state.technicalSkills)}]
      : [],
    experiences: state.experiences.map(e => ({
      company:     e.company   || '',
      role:        e.role      || '',
      dateRange:   e.dateRange || '',
      description: e.description || '',
      technologies: dot(e.technologies),
      responsibilities: (e.responsibilities||[]).filter(r=>r.trim())
    })),
    education:      state.education.map(e=>     ({school:e.school||'',period:e.period||'',degree:e.degree||''})),
    certifications: state.certifications.map(c=>({certName:c.certName||'',year:c.year||''})),
    languages:      state.languages.map(l=>     ({language:l.language||'',level:l.level||''}))
  };
}

async function genDocx() {
  // Wait for docxtemplater to be available
  for(let i=0;i<20;i++){
    if(typeof docxtemplater!=='undefined' && typeof PizZip!=='undefined') break;
    await new Promise(r=>setTimeout(r,250));
  }
  if(typeof docxtemplater==='undefined'){
    showToast('❌ Library not loaded. Check internet & refresh.'); return;
  }

  try {
    showToast('⏳ Generating DOCX…');
    const binStr = atob(TEMPLATE_B64);
    const bytes  = new Uint8Array(binStr.length);
    for(let i=0;i<binStr.length;i++) bytes[i]=binStr.charCodeAt(i);

    const zip = new PizZip(bytes.buffer);
    const doc = new docxtemplater(zip,{paragraphLoop:true,linebreaks:true});
    doc.render(collectDocxData());

    const out  = doc.getZip().generate({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
    const url  = URL.createObjectURL(out);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = (state.name||'CV').replace(/[^a-z0-9_\- ]/gi,'_') + '.docx';
    a.click();
    URL.revokeObjectURL(url);
    showToast('✅ DOCX downloaded!');
  } catch(e) {
    console.error(e);
    showToast('❌ Error: '+e.message);
  }
}

// ═══════════════════════════════════════════════════════════════════════════
//  PDF  (html2pdf on preview)
// ═══════════════════════════════════════════════════════════════════════════

function genPdf() {
  const el = document.getElementById('cvOut');
  if(!el||!el.firstElementChild){showToast('❌ Nothing to export');return;}
  if(typeof html2pdf==='undefined'){showToast('❌ html2pdf not loaded');return;}
  showToast('⏳ Generating PDF…');
  const name = (state.name||'CV').replace(/[^a-z0-9_\- ]/gi,'_');
  const orig = el.style.width;
  el.style.width = '794px';
  html2pdf().set({
    margin:[10,10,10,10],
    filename: name+'.pdf',
    image:{type:'jpeg',quality:.98},
    html2canvas:{scale:2,useCORS:true,logging:false},
    jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}
  }).from(el.firstElementChild).save().then(()=>{
    el.style.width=orig;
    showToast('✅ PDF downloaded!');
  });
}

// ═══════════════════════════════════════════════════════════════════════════
//  HTML PREVIEW  (hardcoded, independent of template.docx styling)
// ═══════════════════════════════════════════════════════════════════════════

function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

let previewTimer=null;
function schedulePreview(){clearTimeout(previewTimer);previewTimer=setTimeout(buildPreview,300);}

function buildPreview(){
  const s=state;
  const dot = a=>(a||[]).filter(Boolean).join(' · ');

  // Header
  let html=`<div class="cv">
  <div class="cv-hdr">
    <div class="cv-hdr-name">
      <h1>${esc(s.name)}</h1>
      <p>${esc(s.position)}</p>
    </div>
    <div class="cv-hdr-logo"><img src="${LOGO_SRC}" alt="SevenPro"></div>
  </div>
  <div class="cv-body">`;

  // Interview insights
  if(s.recruitmentFeedback||s.technicalFeedback){
    html+=`<div class="cv-sec">
      <div class="cv-sec-title">Interview insights</div>`;
    if(s.recruitmentFeedback) html+=`
      <div class="cv-label">Recruitment feedback:</div>
      <div class="cv-text">${esc(s.recruitmentFeedback)}</div>`;
    if(s.technicalFeedback) html+=`
      <div class="cv-label">Technical feedback:</div>
      <div class="cv-text">${esc(s.technicalFeedback)}</div>`;
    html+=`</div>`;
  }

  // Technical skills
  if(s.technicalSkills.length){
    html+=`<div class="cv-sec">
      <div class="cv-sec-title">Technical skills</div>
      <div class="cv-tech"><strong>Technical Skills:&nbsp;&nbsp;</strong>${esc(dot(s.technicalSkills))}</div>
    </div>`;
  }

  // Professional experience
  if(s.experiences.length){
    html+=`<div class="cv-sec"><div class="cv-sec-title">Professional experience</div>`;
    s.experiences.forEach(e=>{
      html+=`<div class="cv-exp-block">
        <div class="cv-exp-row">
          <span class="cv-company">${esc(e.company)}</span>
          <span class="cv-date">${esc(e.dateRange)}</span>
        </div>
        <div class="cv-role">${esc(e.role)}</div>`;
      if(e.description){
        html+=`<div class="cv-cap">Project Description</div>
        <div class="cv-text">${esc(e.description)}</div>`;
      }
      if(e.technologies.length){
        html+=`<div class="cv-cap">Technologies</div>
        <div class="cv-tech">${esc(dot(e.technologies))}</div>`;
      }
      if((e.responsibilities||[]).filter(r=>r.trim()).length){
        html+=`<div class="cv-cap">Responsibilities</div><ul class="cv-ul">`;
        e.responsibilities.filter(r=>r.trim()).forEach(r=>{
          html+=`<li>${esc(r)}</li>`;
        });
        html+=`</ul>`;
      }
      html+=`</div>`;
    });
    html+=`</div>`;
  }

  // Education
  if(s.education.length){
    html+=`<div class="cv-sec"><div class="cv-sec-title">Education</div>`;
    s.education.forEach(e=>{
      html+=`<div style="margin-bottom:10px">
        <div class="cv-label">${esc(e.school)}</div>
        <div class="cv-meta">${esc(e.period)}</div>
        <div class="cv-text">${esc(e.degree)}</div>
      </div>`;
    });
    html+=`</div>`;
  }

  // Certifications
  if(s.certifications.length){
    html+=`<div class="cv-sec"><div class="cv-sec-title">Certification</div>`;
    s.certifications.forEach(c=>{
      html+=`<div style="margin-bottom:7px">
        <div class="cv-label">${esc(c.certName)}</div>
        <div class="cv-meta">${esc(c.year)}</div>
      </div>`;
    });
    html+=`</div>`;
  }

  // Languages
  if(s.languages.length){
    html+=`<div class="cv-sec"><div class="cv-sec-title">Languages</div>`;
    s.languages.forEach(l=>{
      html+=`<div class="cv-text"><strong>${esc(l.language)}:</strong> ${esc(l.level)}</div>`;
    });
    html+=`</div>`;
  }

  html+=`</div>
  <div class="cv-ftr">
    <span>SevenPro ©</span>
    <span>welcome@seven-pro.com &nbsp;&nbsp; www.seven-pro.com</span>
  </div>
</div>`;

  document.getElementById('cvOut').innerHTML=html;
}

function ge(id){return document.getElementById(id);}

function toggleCard(id){
  const b=ge(id+'_b'),a=ge(id+'_a');
  b.classList.toggle('open');if(a)a.classList.toggle('open');
}

function mkCard(id,icon,ic,title,open,body){
  const d=document.createElement('div');d.className='card';
  d.innerHTML=`<div class="card-head" onclick="toggleCard('${id}')">
    <div class="ch-l">
      <div class="ch-icon ${ic}">${icon}</div>
      <span class="ch-title">${title}</span>
    </div>
    <span class="ch-arr ${open?'open':''}" id="${id}_a">▼</span>
  </div>
  <div class="card-body ${open?'open':''}" id="${id}_b">${body}</div>`;
  return d;
}

// Tag inputs
function mkTags(wrap,arr,onChange){
  wrap.innerHTML='';
  arr.forEach((t,i)=>{
    const s=document.createElement('span');s.className='tag';
    s.innerHTML=esc(t)+`<button class="tx" data-i="${i}">×</button>`;
    s.querySelector('.tx').onclick=ev=>{ev.stopPropagation();arr.splice(i,1);onChange(arr);mkTags(wrap,arr,onChange);};
    wrap.appendChild(s);
  });
  const inp=document.createElement('input');
  inp.className='tinp';inp.placeholder='Type & press Enter or ,';
  inp.onkeydown=ev=>{
    if((ev.key==='Enter'||ev.key===',')&&inp.value.trim()){
      ev.preventDefault();
      const v=inp.value.replace(/,$/,'').trim();
      if(v){arr.push(v);onChange(arr);mkTags(wrap,arr,onChange);}
    }
    if(ev.key==='Backspace'&&!inp.value&&arr.length){arr.pop();onChange(arr);mkTags(wrap,arr,onChange);}
  };
  inp.onblur=()=>{
    const v=inp.value.replace(/,$/,'').trim();
    if(v){arr.push(v);onChange(arr);mkTags(wrap,arr,onChange);}
  };
  wrap.appendChild(inp);
  wrap.onclick=()=>inp.focus();
}

// CRUD
function toggleExp(i){const b=ge('eb'+i),a=ge('earr'+i);b.classList.toggle('open');if(a)a.textContent=b.classList.contains('open')?'▲':'▼';}
function rsec(id,html){const b=ge(id+'_b');if(b)b.innerHTML=html;}
function initTW(){state.experiences.forEach((_,i)=>{const w=ge('tw'+i);if(w)mkTags(w,state.experiences[i].technologies,t=>{state.experiences[i].technologies=t;schedulePreview();});})}

function addExp(){state.experiences.push({company:'',role:'',dateRange:'',description:'',technologies:[],responsibilities:['']});rsec('exp',buildExpHtml());initTW();schedulePreview();}
function rmExp(ev,i){ev.stopPropagation();if(state.experiences.length<=1)return;state.experiences.splice(i,1);rsec('exp',buildExpHtml());initTW();schedulePreview();}
function addResp(i){state.experiences[i].responsibilities.push('');rsec('exp',buildExpHtml());initTW();schedulePreview();}
function rmResp(i,ri){state.experiences[i].responsibilities.splice(ri,1);rsec('exp',buildExpHtml());initTW();schedulePreview();}
function addEdu(){state.education.push({school:'',period:'',degree:''});rsec('edu',buildEduHtml());schedulePreview();}
function rmEdu(i){state.education.splice(i,1);rsec('edu',buildEduHtml());schedulePreview();}
function addCert(){state.certifications.push({certName:'',year:''});rsec('cert',buildCertHtml());schedulePreview();}
function rmCert(i){state.certifications.splice(i,1);rsec('cert',buildCertHtml());schedulePreview();}
function addLang(){state.languages.push({language:'',level:''});rsec('lang',buildLangHtml());schedulePreview();}
function rmLang(i){state.languages.splice(i,1);rsec('lang',buildLangHtml());schedulePreview();}

function buildForm(){
  const root=ge('formRoot');root.innerHTML='';
  root.appendChild(mkCard('basic','👤','ic-r','Basic Info',true,`
    <div class="row">
      <div class="field"><label>Full Name</label>
        <input type="text" value="${esc(state.name)}"
          oninput="state.name=this.value;schedulePreview()">
      </div>
      <div class="field"><label>Current Position</label>
        <input type="text" value="${esc(state.position)}"
          oninput="state.position=this.value;schedulePreview()">
      </div>
    </div>`));

  root.appendChild(mkCard('insights','💬','ic-b','Interview Insights',true,`
    <div class="field"><label>Recruitment Feedback</label>
      <textarea oninput="state.recruitmentFeedback=this.value;schedulePreview()">${esc(state.recruitmentFeedback)}</textarea>
    </div>
    <div class="field"><label>Technical Feedback</label>
      <textarea oninput="state.technicalFeedback=this.value;schedulePreview()">${esc(state.technicalFeedback)}</textarea>
    </div>`));

  root.appendChild(mkCard('skills','⚙️','ic-a','Technical Skills',true,`
    <div class="field"><label>Skills</label>
      <div class="tw" id="skillsWrap"></div>
      <div class="hint">Press Enter or comma to add a skill</div>
    </div>`));

  root.appendChild(mkCard('exp','🏢','ic-p','Professional Experience',true,buildExpHtml()));
  root.appendChild(mkCard('edu','🎓','ic-g','Education',false,buildEduHtml()));
  root.appendChild(mkCard('cert','📜','ic-a','Certifications',false,buildCertHtml()));
  root.appendChild(mkCard('lang','🌐','ic-gr','Languages',false,buildLangHtml()));

  mkTags(ge('skillsWrap'),state.technicalSkills,t=>{state.technicalSkills=t;schedulePreview();});
  initTW();
}
