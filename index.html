<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SevenPro — CV Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html-docx-js@0.3.1/dist/html-docx.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --red:#EF4A37;--purple:#6B3FA0;--dark:#1A1A1A;--gray:#666;
  --border:#E8E8E8;--bg:#F7F6F4;--card:#fff;
  --font:'Montserrat',system-ui,sans-serif;
  --mono:'DM Mono',monospace;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--dark);font-size:14px;-webkit-font-smoothing:antialiased;}

/* ── App shell ── */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.topbar{background:var(--dark);display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;flex-shrink:0;z-index:10;}
.topbar-logo{display:flex;align-items:center;height:52px;}
.topbar-logo img{height:26px;width:auto;display:block;}
.topbar-sep{width:1px;height:20px;background:rgba(255,255,255,.15);margin:0 14px;}
.topbar-subtitle{font-size:12px;color:rgba(255,255,255,.4);font-family:var(--mono);letter-spacing:.04em;}
.topbar-actions{display:flex;gap:8px;align-items:center;}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 15px;border-radius:6px;font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;border:none;transition:opacity .15s,transform .1s;white-space:nowrap;letter-spacing:.01em;}
.btn:active{transform:scale(.97);}
.btn:hover{opacity:.85;}
.btn-primary{background:var(--red);color:#fff;}
.btn-secondary{background:rgba(255,255,255,.1);color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.12);}
.btn-secondary:hover{background:rgba(255,255,255,.16);opacity:1;}
.btn-outline{background:transparent;color:var(--dark);border:1px solid var(--border);font-size:11px;padding:5px 11px;}
.btn-ghost{background:transparent;color:var(--gray);border:1px solid transparent;font-size:11px;padding:5px 9px;}
.btn-ghost:hover{border-color:var(--border);color:var(--dark);}
.btn-danger{background:#FFF0EE;color:#C0392B;border:1px solid #FDDBD7;font-size:11px;padding:5px 11px;}
.btn-add{background:var(--bg);color:var(--purple);border:1.5px dashed #C4B5D9;font-size:12px;width:100%;padding:9px;border-radius:8px;margin-top:6px;cursor:pointer;font-family:var(--font);font-weight:600;transition:background .15s;}
.btn-add:hover{background:#F0EBF9;}
.btn-preview-toggle{display:none;}

/* ── Panels ── */
.panels{display:flex;flex:1;overflow:hidden;}
.form-panel{width:480px;flex-shrink:0;overflow-y:auto;border-right:1px solid var(--border);}
.preview-panel{flex:1;overflow-y:auto;background:#DDDBD8;padding:28px 20px;display:flex;flex-direction:column;align-items:center;}
.preview-label{font-size:10px;color:#888;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px;font-family:var(--mono);}

/* ── Form ── */
.form-inner{padding:16px 16px 56px;display:flex;flex-direction:column;gap:5px;}
.section-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;cursor:pointer;user-select:none;transition:background .1s;}
.section-head:hover{background:#FAFAFA;}
.s-left{display:flex;align-items:center;gap:9px;}
.s-icon{width:27px;height:27px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.ic-red{background:#FFF0EE;}.ic-blue{background:#EBF2FF;}.ic-purple{background:#F0EBF9;}
.ic-green{background:#EDFDF4;}.ic-amber{background:#FFF9EB;}.ic-gray{background:#F5F5F5;}
.s-title{font-size:13px;font-weight:600;color:var(--dark);}
.s-chev{color:#C0C0C0;font-size:9px;transition:transform .2s;}
.s-chev.open{transform:rotate(180deg);}
.s-body{padding:0 13px 13px;display:none;flex-direction:column;gap:10px;}
.s-body.open{display:flex;}
.row{display:flex;gap:9px;}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0;}
label{font-size:11px;font-weight:500;color:#555;letter-spacing:.01em;}
input[type=text],textarea{background:#FAFAFA;border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-family:var(--font);font-size:12px;color:var(--dark);outline:none;width:100%;transition:border-color .15s,box-shadow .15s;}
input:focus,textarea:focus{border-color:var(--purple);background:#fff;box-shadow:0 0 0 3px rgba(107,63,160,.1);}
textarea{resize:vertical;min-height:62px;line-height:1.5;}
.hint{font-size:10px;color:#AAA;margin-top:1px;}

/* Tags */
.tags-wrap{background:#FAFAFA;border:1px solid var(--border);border-radius:6px;padding:5px 7px;min-height:36px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;cursor:text;transition:border-color .15s;}
.tags-wrap:focus-within{border-color:var(--purple);background:#fff;box-shadow:0 0 0 3px rgba(107,63,160,.1);}
.tag{background:#EDE8F5;color:var(--purple);border-radius:4px;padding:2px 6px 2px 8px;font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:3px;}
.tag-x{cursor:pointer;color:#A78BCC;font-size:12px;line-height:1;border:none;background:none;padding:0;}
.tag-x:hover{color:#C0392B;}
.tags-input{border:none;background:transparent;outline:none;font-family:var(--font);font-size:12px;color:var(--dark);min-width:60px;flex:1;padding:1px 0;}

/* Experience cards */
.exp-card{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:5px;}
.exp-head{display:flex;align-items:center;justify-content:space-between;padding:8px 11px;background:#FAFAFA;cursor:pointer;font-size:12px;font-weight:600;color:#444;user-select:none;}
.exp-num{width:20px;height:20px;background:var(--purple);color:#fff;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
.exp-body{padding:11px;display:none;flex-direction:column;gap:8px;}
.exp-body.open{display:flex;}
.resp-list{display:flex;flex-direction:column;gap:4px;}
.resp-item{display:flex;gap:5px;align-items:center;}
.resp-item input{flex:1;}

/* ── Preview iframe ── */
#previewFrame{
  width:100%;min-height:500px;border:none;display:block;
  box-shadow:0 4px 32px rgba(0,0,0,.22);
  border-radius:2px;background:#fff;
}
.preview-loading{
  display:flex;align-items:center;justify-content:center;
  min-height:300px;color:#AAA;font-size:13px;font-family:var(--mono);
  letter-spacing:.05em;
}

/* ── Toast ── */
.toast{position:fixed;bottom:20px;right:20px;background:#1A1A1A;color:#fff;padding:10px 16px;border-radius:8px;font-size:12px;font-family:var(--font);opacity:0;transform:translateY(6px);transition:all .2s;pointer-events:none;z-index:999;max-width:280px;}
.toast.show{opacity:1;transform:translateY(0);}

/* ── Scrollbars ── */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:#D0D0D0;border-radius:99px;}

/* ── Mobile ── */
@media(max-width:860px){
  .app{height:auto;min-height:100vh;overflow:visible;}
  .panels{flex-direction:column;overflow:visible;}
  .form-panel{width:100%;border-right:none;border-bottom:1px solid var(--border);overflow:visible;}
  .preview-panel{display:none;padding:16px 8px;}
  .preview-panel.show-mobile{display:flex;}
  .topbar{position:sticky;top:0;z-index:100;}
  .topbar-sep,.topbar-subtitle{display:none;}
  .btn-preview-toggle{display:inline-flex!important;}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-logo">
      <img src="images/image1.png" alt="SevenPro">
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="topbar-sep"></div>
      <span class="topbar-subtitle">CV Generator</span>
    </div>
    <div style="flex:1"></div>
    <div class="topbar-actions">
      <button class="btn btn-preview-toggle btn-secondary" onclick="toggleMobilePreview()">👁 Preview</button>
      <button class="btn btn-secondary" onclick="generatePdf()">↓ PDF</button>
      <button class="btn btn-primary" onclick="generateDocx()">↓ DOCX</button>
    </div>
  </div>

  <div class="panels">
    <div class="form-panel">
      <div class="form-inner" id="formInner"></div>
    </div>
    <div class="preview-panel" id="previewPanel">
      <div class="preview-label">Live Preview</div>
      <div id="previewWrap">
        <div class="preview-loading" id="previewLoading">Loading template…</div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
const state = {
  name: 'Anton K.',
  position: 'Senior .Net/JavaScript Developer',
  recruitmentFeedback: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. In eget metus convallis, consequat ipsum non, pulvinar leo.',
  technicalFeedback: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. In eget metus convallis, consequat ipsum non, pulvinar leo.',
  technicalSkills: ['React','Node.js','TypeScript','SQL Server'],
  experiences: [{
    company:'Company Test', role:'Software Engineer',
    dateRange:'December 2017 – November 2019',
    description:'All services related to renting a home. Special services for landlords, agents, integration with third-party services.',
    technologies:['Windows Forms','Web Services','.Net Framework 3.5'],
    responsibilities:['Working closely with a part of a team in Iceland;','Improving the performance of the current solutions;','Technical documentation.']
  }],
  education:[{school:'UEPA (Ukrainian Engineering and Pedagogical Academy)',period:'1999 – 2005 · Kharkiv, Ukraine',degree:"Master's Degree in Radio-Electronics, Computer Systems"}],
  certifications:[{certName:'Oracle Certified Associate',year:'2015'}],
  languages:[{language:'English',level:'Upper-Intermediate'},{language:'Ukrainian',level:'Native'}]
};

// ── Template ──────────────────────────────────────────────────────────────────
let templateHtml = null;
let previewTimer = null;

async function loadTemplate() {
  try {
    const resp = await fetch('template.html');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    templateHtml = await resp.text();
    schedulePreview();
  } catch(e) {
    document.getElementById('previewLoading').textContent = '⚠ Could not load template.html — make sure you are running this on a web server (not opening the file directly).';
    console.error('Template load error:', e);
  }
}

// ── Template engine ───────────────────────────────────────────────────────────
function renderTemplate(html, data) {
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function process(text, ctx) {
    // 1. Process {#section}...{/section} loops
    text = text.replace(/\{#([^}]+)\}([\s\S]*?)\{\/\1\}/g, function(_, name, inner) {
      const items = ctx[name];
      if (!items || !Array.isArray(items) || !items.length) return '';
      return items.map(function(item) {
        if (typeof item === 'object' && item !== null) {
          return process(inner, item);
        } else {
          // Primitive value — replace {.}
          return inner.replace(/\{\.\}/g, esc(item));
        }
      }).join('');
    });

    // 2. Replace remaining {.} for current primitive context
    if (typeof ctx === 'string') {
      text = text.replace(/\{\.\}/g, esc(ctx));
    }

    // 3. Replace {variable} placeholders
    text = text.replace(/\{([^#\/\.\s][^}]*)\}/g, function(match, name) {
      const val = ctx[name.trim()];
      return val !== undefined ? esc(String(val)) : '';
    });

    return text;
  }

  return process(html, data);
}

function collectData() {
  const dot = arr => (arr||[]).filter(Boolean).join('  ·  ');
  return {
    candidateName: state.name || '',
    position: state.position || '',
    recruitmentFeedback: state.recruitmentFeedback || '',
    technicalFeedback: state.technicalFeedback || '',
    skillGroups: state.technicalSkills.length
      ? [{ label: 'Technical Skills', items: dot(state.technicalSkills) }]
      : [],
    experiences: state.experiences.map(e => ({
      company: e.company || '',
      role: e.role || '',
      dateRange: e.dateRange || '',
      description: e.description || '',
      technologies: dot(e.technologies),
      responsibilities: (e.responsibilities||[]).filter(r=>r.trim())
    })),
    education: state.education.map(e => ({school:e.school||'',period:e.period||'',degree:e.degree||''})),
    certifications: state.certifications.map(c => ({certName:c.certName||'',year:c.year||''})),
    languages: state.languages.map(l => ({language:l.language||'',level:l.level||''}))
  };
}

// ── Preview (iframe) ──────────────────────────────────────────────────────────
function schedulePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(updatePreview, 350);
}

function updatePreview() {
  if (!templateHtml) return;

  // Inject CSS fix for logo + page scaling before rendering
  const cssInject = `<style>
    /* Fix logo image background: show original as-is */
    table.c18 img { display:block; }
    /* Prevent overflow in narrow iframe */
    .c36 { max-width:100% !important; }
  </style>`;

  let filled = renderTemplate(templateHtml, collectData());
  // Inject CSS right before </head>
  filled = filled.replace('</head>', cssInject + '</head>');

  const wrap = document.getElementById('previewWrap');
  let iframe = document.getElementById('previewFrame');

  if (!iframe) {
    document.getElementById('previewLoading').style.display = 'none';
    iframe = document.createElement('iframe');
    iframe.id = 'previewFrame';
    // No sandbox: allows Google Fonts and external CSS to load correctly
    wrap.appendChild(iframe);
  }

  // srcdoc instead of blob URL — inherits parent origin, fonts load correctly
  iframe.srcdoc = filled;

  iframe.onload = function() {
    try {
      const h = iframe.contentDocument.body.scrollHeight;
      if (h > 100) iframe.style.height = (h + 30) + 'px';
    } catch(e){}
  };
}

// ── PDF ───────────────────────────────────────────────────────────────────────
function generatePdf() {
  if (!templateHtml) { showToast('⏳ Template not loaded yet, please wait…'); return; }
  let filled = renderTemplate(templateHtml, collectData());
  // Inject print CSS
  filled = filled.replace('</head>', '<style>@media print{@page{size:A4;margin:0;}body{-webkit-print-color-adjust:exact;}}</style></head>');
  const win = window.open('', '_blank', 'width=900,height=1200');
  if (!win) { showToast('❌ Pop-up blocked — allow pop-ups for this site'); return; }
  win.document.open();
  win.document.write(filled);
  win.document.close();
  // Wait for fonts/images to load before opening print dialog
  win.addEventListener('load', function() {
    setTimeout(function() { win.focus(); win.print(); }, 800);
  });
  showToast('⏳ Opening print dialog…');
}

// ── DOCX ──────────────────────────────────────────────────────────────────────
function generateDocx() {
  if (!templateHtml) { showToast('⏳ Template not loaded yet, please wait…'); return; }
  if (typeof htmlDocx === 'undefined') {
    showToast('❌ html-docx-js library not loaded. Check your internet connection.');
    return;
  }
  try {
    const filled = renderTemplate(templateHtml, collectData());
    const blob = htmlDocx.asBlob(filled);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (state.name || 'CV') + '.docx';
    a.click();
    URL.revokeObjectURL(url);
    showToast('✅ DOCX downloaded!');
  } catch(e) {
    console.error(e);
    showToast('❌ Error: ' + e.message);
  }
}

// ── Toast ──────────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Mobile ─────────────────────────────────────────────────────────────────────
function toggleMobilePreview() {
  document.getElementById('previewPanel').classList.toggle('show-mobile');
}

// ── Helpers ────────────────────────────────────────────────────────────────────
const ge = id => document.getElementById(id);
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// ── Tag Input ─────────────────────────────────────────────────────────────────
function renderTags(container, tags, onChange) {
  container.innerHTML = '';
  tags.forEach((tag, i) => {
    const s = document.createElement('span'); s.className = 'tag';
    s.innerHTML = esc(tag) + `<button class="tag-x" data-i="${i}">×</button>`;
    s.querySelector('.tag-x').onclick = ev => {
      ev.stopPropagation(); tags.splice(i,1); onChange(tags); renderTags(container, tags, onChange);
    };
    container.appendChild(s);
  });
  const inp = document.createElement('input');
  inp.className = 'tags-input'; inp.placeholder = 'Type & press Enter or ,';
  inp.onkeydown = ev => {
    if ((ev.key === 'Enter' || ev.key === ',') && inp.value.trim()) {
      ev.preventDefault();
      const v = inp.value.replace(/,$/, '').trim();
      if (v) { tags.push(v); onChange(tags); renderTags(container, tags, onChange); }
    }
    if (ev.key === 'Backspace' && !inp.value && tags.length) {
      tags.pop(); onChange(tags); renderTags(container, tags, onChange);
    }
  };
  inp.onblur = () => {
    const v = inp.value.replace(/,$/, '').trim();
    if (v) { tags.push(v); onChange(tags); renderTags(container, tags, onChange); }
  };
  container.appendChild(inp);
  container.onclick = () => inp.focus();
}

// ── Section toggle ─────────────────────────────────────────────────────────────
function toggleSec(id) {
  const b = ge(id+'_body'), c = ge(id+'_chev');
  b.classList.toggle('open'); if(c) c.classList.toggle('open');
}

function mkSection(id, icon, ic, title, open, bodyHtml) {
  const d = document.createElement('div'); d.className = 'section-card';
  d.innerHTML = `
    <div class="section-head" onclick="toggleSec('${id}')">
      <div class="s-left">
        <div class="s-icon ${ic}">${icon}</div>
        <span class="s-title">${title}</span>
      </div>
      <span class="s-chev ${open?'open':''}" id="${id}_chev">▼</span>
    </div>
    <div class="s-body ${open?'open':''}" id="${id}_body">${bodyHtml}</div>`;
  return d;
}

// ── Experience HTML ────────────────────────────────────────────────────────────
function buildExpHtml() {
  let h = '';
  state.experiences.forEach((exp, i) => {
    const lbl = exp.company || `Experience ${i+1}`;
    const respH = exp.responsibilities.map((r, ri) => `
      <div class="resp-item">
        <input type="text" value="${esc(r)}" placeholder="Add responsibility…"
          oninput="state.experiences[${i}].responsibilities[${ri}]=this.value;schedulePreview()">
        <button class="btn btn-ghost" onclick="removeResp(${i},${ri})">✕</button>
      </div>`).join('');
    h += `<div class="exp-card" id="ec_${i}">
      <div class="exp-head" onclick="toggleExp(${i})">
        <div style="display:flex;align-items:center;gap:7px">
          <span class="exp-num">${i+1}</span>
          <span id="elbl_${i}">${esc(lbl)}</span>
        </div>
        <div style="display:flex;gap:5px;align-items:center">
          ${state.experiences.length>1?`<button class="btn btn-danger" onclick="rmExp(event,${i})">Remove</button>`:''}
          <span style="color:#CCC;font-size:9px" id="echev_${i}">▼</span>
        </div>
      </div>
      <div class="exp-body ${i===0?'open':''}" id="eb_${i}">
        <div class="row">
          <div class="field"><label>Company Name</label>
            <input type="text" value="${esc(exp.company)}" placeholder="Company"
              oninput="state.experiences[${i}].company=this.value;ge('elbl_${i}').textContent=this.value||'Experience ${i+1}';schedulePreview()">
          </div>
          <div class="field"><label>Role / Position</label>
            <input type="text" value="${esc(exp.role)}" placeholder="Software Engineer"
              oninput="state.experiences[${i}].role=this.value;schedulePreview()">
          </div>
        </div>
        <div class="field"><label>Date Range</label>
          <input type="text" value="${esc(exp.dateRange)}" placeholder="Jan 2022 – Present"
            oninput="state.experiences[${i}].dateRange=this.value;schedulePreview()">
        </div>
        <div class="field"><label>Project Description</label>
          <textarea oninput="state.experiences[${i}].description=this.value;schedulePreview()">${esc(exp.description)}</textarea>
        </div>
        <div class="field"><label>Technologies</label>
          <div class="tags-wrap" id="tw_${i}"></div>
          <div class="hint">Type & press Enter or comma to add</div>
        </div>
        <div class="field"><label>Responsibilities</label>
          <div class="resp-list" id="rl_${i}">${respH}</div>
          <button class="btn btn-outline" style="margin-top:5px;width:fit-content" onclick="addResp(${i})">+ Add responsibility</button>
        </div>
      </div>
    </div>`;
  });
  h += `<button class="btn btn-add" onclick="addExp()">＋ Add Experience Block</button>`;
  return h;
}

function buildEduHtml() {
  let h = '';
  state.education.forEach((edu, i) => {
    h += `<div class="exp-card">
      <div class="exp-body open" style="padding:11px;display:flex;flex-direction:column;gap:8px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:11px;font-weight:600;color:#555;">Education ${i+1}</span>
          ${state.education.length>1?`<button class="btn btn-danger" onclick="rmEdu(${i})">Remove</button>`:''}
        </div>
        <div class="field"><label>Institution</label>
          <input type="text" value="${esc(edu.school)}" placeholder="University Name"
            oninput="state.education[${i}].school=this.value;schedulePreview()">
        </div>
        <div class="row">
          <div class="field"><label>Period & Location</label>
            <input type="text" value="${esc(edu.period)}" placeholder="2019–2023 · City, Country"
              oninput="state.education[${i}].period=this.value;schedulePreview()">
          </div>
          <div class="field"><label>Degree</label>
            <input type="text" value="${esc(edu.degree)}" placeholder="Bachelor of Science"
              oninput="state.education[${i}].degree=this.value;schedulePreview()">
          </div>
        </div>
      </div>
    </div>`;
  });
  h += `<button class="btn btn-add" onclick="addEdu()">＋ Add Education</button>`;
  return h;
}

function buildCertHtml() {
  let h = '';
  state.certifications.forEach((c, i) => {
    h += `<div class="exp-card">
      <div class="exp-body open" style="padding:11px;display:flex;flex-direction:column;gap:8px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:11px;font-weight:600;color:#555;">Certification ${i+1}</span>
          ${state.certifications.length>1?`<button class="btn btn-danger" onclick="rmCert(${i})">Remove</button>`:''}
        </div>
        <div class="row">
          <div class="field" style="flex:2"><label>Name</label>
            <input type="text" value="${esc(c.certName)}" placeholder="AWS Certified Developer"
              oninput="state.certifications[${i}].certName=this.value;schedulePreview()">
          </div>
          <div class="field" style="flex:1;min-width:80px"><label>Year</label>
            <input type="text" value="${esc(c.year)}" placeholder="2023"
              oninput="state.certifications[${i}].year=this.value;schedulePreview()">
          </div>
        </div>
      </div>
    </div>`;
  });
  h += `<button class="btn btn-add" onclick="addCert()">＋ Add Certification</button>`;
  return h;
}

function buildLangHtml() {
  let h = '';
  state.languages.forEach((l, i) => {
    h += `<div class="exp-card">
      <div style="padding:9px 11px;display:flex;gap:9px;align-items:flex-end;">
        <div class="field" style="flex:2"><label>Language</label>
          <input type="text" value="${esc(l.language)}" placeholder="English"
            oninput="state.languages[${i}].language=this.value;schedulePreview()">
        </div>
        <div class="field" style="flex:2"><label>Level</label>
          <input type="text" value="${esc(l.level)}" placeholder="Upper-Intermediate"
            oninput="state.languages[${i}].level=this.value;schedulePreview()">
        </div>
        ${state.languages.length>1?`<button class="btn btn-danger" style="flex-shrink:0" onclick="rmLang(${i})">✕</button>`:''}
      </div>
    </div>`;
  });
  h += `<button class="btn btn-add" onclick="addLang()">＋ Add Language</button>`;
  return h;
}

// ── Toggle/CRUD ───────────────────────────────────────────────────────────────
function toggleExp(i){ const b=ge(`eb_${i}`),c=ge(`echev_${i}`); b.classList.toggle('open'); if(c) c.textContent=b.classList.contains('open')?'▲':'▼'; }
function rebuildSec(id,html){ const b=ge(id+'_body'); if(b) b.innerHTML=html; }
function initTechTags(){ state.experiences.forEach((_,i)=>{ const w=ge(`tw_${i}`); if(w) renderTags(w, state.experiences[i].technologies, t=>{state.experiences[i].technologies=t;schedulePreview();}); }); }

function addExp(){ state.experiences.push({company:'',role:'',dateRange:'',description:'',technologies:[],responsibilities:['']}); rebuildSec('exp',buildExpHtml()); initTechTags(); schedulePreview(); }
function rmExp(ev,i){ ev.stopPropagation(); if(state.experiences.length<=1) return; state.experiences.splice(i,1); rebuildSec('exp',buildExpHtml()); initTechTags(); schedulePreview(); }
function addResp(i){ state.experiences[i].responsibilities.push(''); rebuildSec('exp',buildExpHtml()); initTechTags(); schedulePreview(); }
function removeResp(i,ri){ state.experiences[i].responsibilities.splice(ri,1); rebuildSec('exp',buildExpHtml()); initTechTags(); schedulePreview(); }

function addEdu(){ state.education.push({school:'',period:'',degree:''}); rebuildSec('edu',buildEduHtml()); schedulePreview(); }
function rmEdu(i){ state.education.splice(i,1); rebuildSec('edu',buildEduHtml()); schedulePreview(); }
function addCert(){ state.certifications.push({certName:'',year:''}); rebuildSec('cert',buildCertHtml()); schedulePreview(); }
function rmCert(i){ state.certifications.splice(i,1); rebuildSec('cert',buildCertHtml()); schedulePreview(); }
function addLang(){ state.languages.push({language:'',level:''}); rebuildSec('lang',buildLangHtml()); schedulePreview(); }
function rmLang(i){ state.languages.splice(i,1); rebuildSec('lang',buildLangHtml()); schedulePreview(); }

// ── Build Form ────────────────────────────────────────────────────────────────
function buildForm() {
  const root = ge('formInner'); root.innerHTML = '';

  root.appendChild(mkSection('basic','👤','ic-red','Basic Info',true,`
    <div class="row">
      <div class="field"><label>Full Name</label>
        <input type="text" value="${esc(state.name)}" oninput="state.name=this.value;schedulePreview()">
      </div>
      <div class="field"><label>Current Position</label>
        <input type="text" value="${esc(state.position)}" oninput="state.position=this.value;schedulePreview()">
      </div>
    </div>`));

  root.appendChild(mkSection('insights','💬','ic-blue','Interview Insights',true,`
    <div class="field"><label>Recruitment Feedback</label>
      <textarea oninput="state.recruitmentFeedback=this.value;schedulePreview()">${esc(state.recruitmentFeedback)}</textarea>
    </div>
    <div class="field"><label>Technical Feedback</label>
      <textarea oninput="state.technicalFeedback=this.value;schedulePreview()">${esc(state.technicalFeedback)}</textarea>
    </div>`));

  root.appendChild(mkSection('skills','⚙️','ic-amber','Technical Skills',true,`
    <div class="field"><label>Skills</label>
      <div class="tags-wrap" id="skillsWrap"></div>
      <div class="hint">Type a skill and press Enter or comma to add</div>
    </div>`));

  root.appendChild(mkSection('exp','🏢','ic-purple','Professional Experience',true,buildExpHtml()));
  root.appendChild(mkSection('edu','🎓','ic-green','Education',false,buildEduHtml()));
  root.appendChild(mkSection('cert','📜','ic-amber','Certifications',false,buildCertHtml()));
  root.appendChild(mkSection('lang','🌐','ic-gray','Languages',false,buildLangHtml()));

  renderTags(ge('skillsWrap'), state.technicalSkills, t => { state.technicalSkills=t; schedulePreview(); });
  initTechTags();
}

// ── Init ──────────────────────────────────────────────────────────────────────
buildForm();
loadTemplate();
</script>
</body>
</html>
