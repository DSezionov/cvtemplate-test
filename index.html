<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SevenPro — CV Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.js"></script>
<script src="https://unpkg.com/docxtemplater@3.45.1/build/docxtemplater.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--red:#EF4A37;--purple:#6B3FA0;--dark:#1A1A1A;--gray:#666;--border:#E8E8E8;--bg:#F4F3F1;--card:#fff;--f:'Montserrat',system-ui,sans-serif;}
html,body{height:100%;font-family:var(--f);background:var(--bg);color:var(--dark);font-size:14px;-webkit-font-smoothing:antialiased;}
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.topbar{background:var(--dark);display:flex;align-items:center;padding:0 20px;height:52px;flex-shrink:0;gap:14px;}
.tb-logo img{height:24px;display:block;}
.tb-sep{width:1px;height:18px;background:rgba(255,255,255,.2);}
.tb-title{font-size:12px;font-weight:500;color:rgba(255,255,255,.4);letter-spacing:.05em;}
.tb-actions{margin-left:auto;display:flex;gap:8px;}
.panels{display:flex;flex:1;overflow:hidden;}
.lpanel{width:480px;flex-shrink:0;overflow-y:auto;border-right:1px solid var(--border);}
.rpanel{flex:1;overflow-y:auto;background:#DDDBD8;padding:24px 16px;display:flex;flex-direction:column;align-items:center;}
.preview-lbl{font-size:10px;font-weight:600;color:#999;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 15px;border-radius:6px;font-family:var(--f);font-size:12px;font-weight:600;cursor:pointer;border:none;transition:opacity .15s,transform .1s;white-space:nowrap;}
.btn:active{transform:scale(.97);}.btn:hover{opacity:.85;}
.btn-primary{background:var(--red);color:#fff;}
.btn-secondary{background:rgba(255,255,255,.1);color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.12);}
.btn-secondary:hover{background:rgba(255,255,255,.16);opacity:1;}
.btn-outline{background:transparent;color:var(--dark);border:1px solid var(--border);font-size:11px;padding:5px 11px;}
.btn-ghost{background:transparent;color:var(--gray);font-size:11px;padding:5px 9px;border:1px solid transparent;}
.btn-ghost:hover{border-color:var(--border);color:var(--dark);}
.btn-danger{background:#FFF0EE;color:#C0392B;border:1px solid #FDDBD7;font-size:11px;padding:5px 11px;}
.btn-add{background:var(--bg);color:var(--purple);border:1.5px dashed #C4B5D9;font-size:12px;width:100%;padding:9px;border-radius:8px;margin-top:6px;cursor:pointer;font-family:var(--f);font-weight:600;transition:background .15s;}
.btn-add:hover{background:#F0EBF9;}
.btn-mob{display:none;}
.btn-na{background:transparent;border:1px solid var(--border);color:#999;font-size:10px;padding:3px 8px;border-radius:4px;cursor:pointer;font-family:var(--f);font-weight:500;transition:all .15s;}
.btn-na.active{background:#FFF0EE;color:#C0392B;border-color:#FDDBD7;}
.form-inner{padding:14px 14px 60px;display:flex;flex-direction:column;gap:5px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.card.disabled{opacity:.5;}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;cursor:pointer;user-select:none;}
.card-head:hover{background:#FAFAFA;}
.ch-l{display:flex;align-items:center;gap:9px;}
.ch-icon{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
.ic-r{background:#FFF0EE;}.ic-b{background:#EBF2FF;}.ic-p{background:#F0EBF9;}
.ic-g{background:#EDFDF4;}.ic-a{background:#FFF9EB;}.ic-gr{background:#F5F5F5;}
.ch-title{font-size:13px;font-weight:600;}
.ch-right{display:flex;align-items:center;gap:8px;}
.ch-arr{color:#CCC;font-size:9px;transition:transform .2s;}
.ch-arr.open{transform:rotate(180deg);}
.card-body{padding:0 13px 13px;display:none;flex-direction:column;gap:10px;}
.card-body.open{display:flex;}
.row{display:flex;gap:9px;}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0;}
label{font-size:11px;font-weight:500;color:#555;}
input[type=text],textarea{background:#FAFAFA;border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-family:var(--f);font-size:12px;color:var(--dark);outline:none;width:100%;transition:border-color .15s;}
input:focus,textarea:focus{border-color:var(--purple);background:#fff;box-shadow:0 0 0 3px rgba(107,63,160,.1);}
textarea{resize:vertical;min-height:72px;line-height:1.5;}
.hint{font-size:10px;color:#AAA;margin-top:1px;}
.tw{background:#FAFAFA;border:1px solid var(--border);border-radius:6px;padding:5px 7px;min-height:36px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;cursor:text;transition:border-color .15s;}
.tw:focus-within{border-color:var(--purple);background:#fff;box-shadow:0 0 0 3px rgba(107,63,160,.1);}
.tag{background:#EDE8F5;color:var(--purple);border-radius:4px;padding:2px 6px 2px 8px;font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:3px;}
.tx{cursor:pointer;color:#A78BCC;font-size:12px;border:none;background:none;padding:0;line-height:1;}
.tx:hover{color:#C0392B;}
.tinp{border:none;background:transparent;outline:none;font-family:var(--f);font-size:12px;color:var(--dark);min-width:80px;flex:1;padding:1px 0;}
/* Company cards */
.co-card{border:1.5px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:8px;background:var(--card);}
.co-head{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;background:#F8F7FF;cursor:pointer;user-select:none;}
.co-num{width:22px;height:22px;background:var(--purple);color:#fff;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
.co-name{font-size:13px;font-weight:600;color:var(--dark);}
.co-body{padding:11px;display:none;flex-direction:column;gap:10px;}
.co-body.open{display:flex;}
/* Project sub-cards */
.pr-card{border:1px solid #E0DAFA;border-radius:8px;overflow:hidden;margin-bottom:5px;background:#FDFCFF;}
.pr-head{display:flex;align-items:center;justify-content:space-between;padding:7px 11px;background:#F5F3FF;cursor:pointer;font-size:11px;font-weight:600;color:#555;user-select:none;}
.pr-body{padding:10px;display:none;flex-direction:column;gap:8px;}
.pr-body.open{display:flex;}
.pr-label{font-size:9px;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px;}
.rl{display:flex;flex-direction:column;gap:4px;}
.ri{display:flex;gap:5px;align-items:center;}
.ri input{flex:1;}
/* CV Preview — exact match to template2__2_.docx */
.cv{width:720px;background:#fff;box-shadow:0 4px 32px rgba(0,0,0,.2);border-radius:1px;font-family:var(--f);color:#1a1a1a;}
/* Header */
.cv-hdr{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 36px 14px;border-bottom:1.5px solid #e8e8e8;}
.cv-hdr-name h1{font-size:14pt;font-weight:700;color:#1a1a1a;margin:0 0 3px;line-height:1.2;}
.cv-hdr-name p{font-size:11pt;font-weight:400;color:#666666;margin:0;line-height:1.4;}
.cv-hdr-logo{padding-top:2px;}
.cv-hdr-logo img{height:28px;width:auto;display:block;}
.cv-body{padding:0 36px 28px;}
/* Section title — Bold 14pt #6b3fa0 — ALL sections (before=16pt after=9pt) */
.cv-sec-title{font-size:14pt;font-weight:700;color:#6b3fa0;margin:16pt 0 9pt;line-height:1.3;}
/* SemiBold label 12pt #1a1a1a (before=3pt after=1pt) */
.cv-sublabel{font-size:12pt;font-weight:600;color:#1a1a1a;margin:3pt 0 1pt;line-height:1.3;}
/* Regular body 11pt #666666 */
.cv-text{font-size:11pt;font-weight:400;color:#666666;line-height:1.5;margin:0 0 6pt;white-space:pre-wrap;}
/* Skills row (before=4pt after=2pt) */
.cv-skill-line{margin:4pt 0 8pt;line-height:1.4;}
.cv-skill-lbl{font-size:12pt;font-weight:600;color:#1a1a1a;}
.cv-skill-val{font-size:11pt;font-weight:400;color:#666666;}
/* Company row — space-between (company before=12pt) */
.cv-exp-row{display:flex;justify-content:space-between;align-items:baseline;margin:12pt 0 0;}
.cv-company{font-size:12pt;font-weight:700;color:#1a1a1a;}
.cv-date{font-size:11pt;font-weight:400;color:#666666;white-space:nowrap;margin-left:10px;}
/* Role (before=1pt after=10pt) */
.cv-role{font-size:11pt;font-weight:400;color:#666666;margin:1pt 0 10pt;}
/* Technologies box (after=10pt, border all sides #dedede) */
.cv-tech{background:#f2f2f2 !important;border:0.5pt solid #dedede;padding:5pt 10pt;font-size:11pt;font-weight:400;color:#666666;line-height:1.5;margin:0 0 10pt;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
/* Bullets (before=2pt after=2pt) */
.cv-ul{margin:0 0 8pt 18pt;padding:0;}
.cv-ul li{font-size:11pt;font-weight:400;color:#666666;margin:2pt 0;list-style:disc;}
/* Project / company blocks */
.cv-project{padding-bottom:10pt;margin-bottom:4pt;}
.cv-co-block{padding-bottom:6pt;}
/* Prevent page-break inside key CV elements */
.cv-co-block,.cv-tech,.cv-ul,.cv-sublabel,.cv-institution,.cv-lang-row,.cv-text,.cv-role,.cv-exp-row{page-break-inside:avoid;break-inside:avoid;}
/* Keep headings with the content that follows them */
.cv-sec-title,.cv-sublabel{break-after:avoid;page-break-after:avoid;}
/* Generic keep-together block */
.cv-block{break-inside:avoid;page-break-inside:avoid;}
/* Education/Cert items (school/certName before=4pt after=1pt) */
.cv-institution{font-size:12pt;font-weight:600;color:#1a1a1a;margin:4pt 0 1pt;line-height:1.3;}
/* period/degree (after=1pt, 8pt) */
.cv-period{font-size:11pt;font-weight:400;color:#666666;margin:0 0 1pt;}
.cv-degree{font-size:11pt;font-weight:400;color:#666666;margin:0 0 8pt;}
/* year (after=5pt) */
.cv-year{font-size:11pt;font-weight:400;color:#666666;margin:0 0 5pt;}
/* Language (before=4pt after=3pt) */
.cv-lang-row{margin:4pt 0 3pt;line-height:1.4;}
.cv-lang-name{font-size:12pt;font-weight:600;color:#1a1a1a;}
.cv-lang-val{font-size:11pt;font-weight:400;color:#666666;}
/* Divider (matches template empty para with border-bottom) */
.cv-section-divider{border:none;border-top:1px solid #dddddd;margin:0 -36px;}
/* Between projects within the same company — spacing only, no visible line */
.cv-proj-divider{border:none;margin:20pt 0 0;}
/* Between different companies — spacing only, no line */
.cv-co-divider{border:none;margin:28pt 0 0;}
.cv-ftr{border-top:1px solid #e8e8e8;padding:10px 36px;display:flex;justify-content:space-between;align-items:center;}
.toast{position:fixed;bottom:20px;right:20px;background:#1A1A1A;color:#fff;padding:10px 16px;border-radius:8px;font-size:12px;font-family:var(--f);opacity:0;transform:translateY(6px);transition:all .2s;pointer-events:none;z-index:999;max-width:280px;}
.toast.show{opacity:1;transform:translateY(0);}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:#D0D0D0;border-radius:99px;}
@media(max-width:860px){
  .app{height:auto;min-height:100vh;overflow:visible;}
  .panels{flex-direction:column;overflow:visible;}
  .lpanel{width:100%;border-right:none;border-bottom:1px solid var(--border);}
  .rpanel{display:none;padding:12px 8px;}
  .rpanel.mob-show{display:flex;}
  .topbar{position:sticky;top:0;z-index:100;}
  .tb-sep,.tb-title{display:none;}
  .btn-mob{display:inline-flex!important;}
  .cv{width:100%;font-size:8.5pt;}
  .cv-hdr{padding:12px 14px 10px;}
  .cv-body{padding:12px 14px 18px;}
  .cv-ftr{padding:7px 14px;}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="tb-logo"><img src="Seven-Pro-Logotypes.svg" alt="SevenPro"></div>
    <div class="tb-sep"></div>
    <span class="tb-title">CV Generator</span>
    <div class="tb-actions">
      <button class="btn btn-secondary btn-mob" onclick="toggleMob()">👁 Preview</button>
      <button class="btn btn-secondary" onclick="genDocx()">↓ DOCX</button>
      <button class="btn btn-primary" onclick="genPdf()">↓ PDF</button>
    </div>
  </div>
  <div class="panels">
    <div class="lpanel"><div class="form-inner" id="formRoot"></div></div>
    <div class="rpanel" id="rpanel">
      <div class="preview-lbl">Live Preview</div>
      <div id="cvOut"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

// ─────────────────────────────────────────────────────────────────────────────
// DOCX DATA COLLECTION
// ─────────────────────────────────────────────────────────────────────────────
function collectData() {
  const dot = a => (a||[]).filter(Boolean).join(' · ');
  const sh  = state.show;
  return {
    candidateName:       state.name || '',
    position:            state.position || '',
    // linebreaks:true converts \n to DOCX line breaks; strip **markers** so asterisks don't appear in Word
    recruitmentFeedback: sh.insights ? stripBold(state.recruitmentFeedback || '') : '',
    technicalFeedback:   sh.insights ? stripBold(state.technicalFeedback   || '') : '',
    skillGroups: sh.skills && state.technicalSkills.length
      ? [{label:'Technical Skills', items: dot(state.technicalSkills)}]
      : [],
    // Flatten company → projects into flat experiences list
    experiences: sh.experience
      ? state.experiences.flatMap(co =>
          co.projects.map(p => ({
            company:     co.company || '',
            dateRange:   p.dateRange || '',
            role:        p.role || '',
            description: p.description || '',
            technologies: dot(p.technologies),
            responsibilities: (p.responsibilities||[]).filter(r=>r.trim())
          }))
        )
      : [],
    education:      sh.education      ? state.education.map(e=>({school:e.school||'',period:e.period||'',degree:e.degree||''}))      : [],
    certifications: sh.certifications ? state.certifications.map(c=>({certName:c.certName||'',year:c.year||''})) : [],
    languages:      sh.languages      ? state.languages.map(l=>({language:l.language||'',level:l.level||''}))   : []
  };
}

// ─────────────────────────────────────────────────────────────────────────────
// DOCX GENERATION
// ─────────────────────────────────────────────────────────────────────────────
let templateBuffer = null;

async function loadTemplate() {
  try {
    const r = await fetch('template.docx');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    templateBuffer = await r.arrayBuffer();
  } catch(e) { console.warn('template.docx not preloaded:', e.message); }
}

async function genDocx() {
  showToast('⏳ Preparing…');
  if (!templateBuffer) {
    try {
      const r = await fetch('template.docx');
      if (!r.ok) throw new Error('template.docx not found (HTTP ' + r.status + ')');
      templateBuffer = await r.arrayBuffer();
    } catch(e) { showToast('❌ ' + e.message); return; }
  }
  for (let i=0;i<20;i++) {
    if (typeof docxtemplater!=='undefined' && typeof PizZip!=='undefined') break;
    await new Promise(r=>setTimeout(r,250));
  }
  if (typeof docxtemplater==='undefined') { showToast('❌ Library not loaded. Refresh.'); return; }
  try {
    const zip = new PizZip(templateBuffer.slice(0));
    const doc = new docxtemplater(zip, {paragraphLoop:true, linebreaks:true});
    doc.render(collectData());
    const blob = doc.getZip().generate({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = (state.name||'CV').replace(/[^\w\s\-]/g,'') + '.docx';
    a.click(); URL.revokeObjectURL(url);
    showToast('✅ DOCX downloaded!');
  } catch(e) { console.error(e); showToast('❌ ' + e.message); }
}

// ─────────────────────────────────────────────────────────────────────────────
// PDF
// ─────────────────────────────────────────────────────────────────────────────
async function genPdf() {
  buildPreview();
  await new Promise(r => setTimeout(r, 150));

  const cvEl = document.querySelector('#cvOut .cv');
  if (!cvEl) { showToast('❌ Nothing to export'); return; }
  if (typeof html2pdf === 'undefined') { showToast('❌ html2pdf not loaded'); return; }
  showToast('⏳ Generating PDF…');

  const pdfName   = (state.name || 'CV').replace(/[^\w\s\-]/g, '');
  const SIDE_M    = 14;               // mm left/right margin
  const CONTENT_W = 210 - 2 * SIDE_M; // 182 mm

  // Pre-render the HTML header and footer through html2canvas so that
  // Montserrat and all CSS padding are captured exactly as in the preview.
  // This also makes left-alignment identical to the body content automatically.
  const hdrEl = document.querySelector('#cvOut .cv-hdr');
  const ftrEl = document.querySelector('#cvOut .cv-ftr');
  if (!hdrEl || !ftrEl) { showToast('❌ Preview not ready — try again'); return; }
  // Only scale + background needed: header/footer contain only base64 images and
  // already-loaded fonts, so no external fetching is required.
  const canvasOpts = { scale: 2, backgroundColor: '#ffffff', logging: false };
  const [hdrCanvas, ftrCanvas] = await Promise.all([
    html2canvas(hdrEl, canvasOpts),
    html2canvas(ftrEl, canvasOpts)
  ]);
  const hdrDataUrl = hdrCanvas.toDataURL('image/png');
  const ftrDataUrl = ftrCanvas.toDataURL('image/png');

  // Convert canvas pixels → mm.
  // The .cv is 720 px wide; at scale 2 hdrCanvas.width = 1440 px = CONTENT_W mm.
  const px2mm = CONTENT_W / hdrCanvas.width;
  const hdrH  = hdrCanvas.height * px2mm;
  const ftrH  = ftrCanvas.height * px2mm;
  const GAP   = 5; // mm breathing room between stamp and body text
  const topM  = Math.ceil(hdrH) + GAP;
  const botM  = Math.ceil(ftrH) + GAP;

  // Clone CV body — strip header and footer, they are stamped per-page from canvas images.
  const clone    = cvEl.cloneNode(true);
  const cloneHdr = clone.querySelector('.cv-hdr'); if (cloneHdr) cloneHdr.remove();
  const cloneFtr = clone.querySelector('.cv-ftr'); if (cloneFtr) cloneFtr.remove();
  clone.style.cssText    = 'width:720px;box-shadow:none;border-radius:0;background:#fff;';
  clone.style.fontFamily = "'Montserrat', sans-serif";

  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;top:-99999px;left:0;width:720px;z-index:-1;';
  wrap.appendChild(clone);
  document.body.appendChild(wrap);

  try {
    await html2pdf()
      .set({
        margin:   [topM, SIDE_M, botM, SIDE_M],
        filename: pdfName + '.pdf',
        image:    { type: 'jpeg', quality: 0.99 },
        html2canvas: {
          scale: 2, useCORS: true, allowTaint: true,
          backgroundColor: '#ffffff', logging: false,
          onclone: (doc) => {
            doc.querySelectorAll('.cv-tech').forEach(el => {
              el.style.backgroundColor = '#f2f2f2';
              el.style.background      = '#f2f2f2';
            });
          }
        },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak: {
          mode: ['css', 'legacy'],
          avoid: ['.cv-block', '.cv-co-block', '.cv-project', '.cv-tech', '.cv-ul',
                  '.cv-sublabel', '.cv-institution', '.cv-lang-row',
                  '.cv-role', '.cv-exp-row']
        }
      })
      .from(clone)
      .toPdf()
      .get('pdf')
      .then(pdf => {
        const n  = pdf.internal.getNumberOfPages();
        const pw = pdf.internal.pageSize.getWidth();
        const ph = pdf.internal.pageSize.getHeight();
        const wc = document.createElement('canvas');
        wc.width = wc.height = 1;
        const wctx = wc.getContext('2d');
        wctx.fillStyle = '#ffffff';
        wctx.fillRect(0, 0, 1, 1);
        const whitePx = wc.toDataURL('image/png');
        for (let i = 1; i <= n; i++) {
          pdf.setPage(i);
          pdf.addImage(whitePx, 'PNG', 0, 0, pw, topM);
          pdf.addImage(whitePx, 'PNG', 0, ph - botM, pw, botM);
          pdf.addImage(hdrDataUrl, 'PNG', SIDE_M, 0, CONTENT_W, hdrH);
          pdf.addImage(ftrDataUrl, 'PNG', SIDE_M, ph - ftrH, CONTENT_W, ftrH);
        }
      })
      .save();

    showToast('✅ PDF downloaded!');
  } catch (e) {
    console.error(e);
    showToast('❌ ' + e.message);
  } finally {
    document.body.removeChild(wrap);
  }
}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderText(s){if(!s)return'';return esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');}
function stripBold(s){return s?s.replace(/\*\*([^*]+)\*\*/g,'$1'):'';}
let previewTimer=null;
function schedulePreview(){clearTimeout(previewTimer);previewTimer=setTimeout(buildPreview,300);}

function buildPreview() {
  const s=state;
  const dot=a=>(a||[]).filter(Boolean).join(' · ');
  let h=`<div class="cv">
  <div class="cv-hdr">
    <div class="cv-hdr-name">
      <h1>${esc(s.name)}</h1>
      <p>${esc(s.position)}</p>
    </div>
    <div class="cv-hdr-logo"><img src="${LOGO_SRC}" alt="SevenPro"></div>
  </div>
  <div class="cv-body">`;

  // Interview insights
  if (s.show.insights && (s.recruitmentFeedback||s.technicalFeedback)) {
    h+=`<div class="cv-sec-title">Interview insights</div>`;
    if(s.recruitmentFeedback) h+=`<div class="cv-sublabel">Recruitment feedback:</div><div class="cv-text" style="margin-bottom:14pt">${renderText(s.recruitmentFeedback)}</div>`;
    if(s.technicalFeedback)   h+=`<div class="cv-sublabel">Technical feedback:</div><div class="cv-text" style="margin-bottom:8pt">${renderText(s.technicalFeedback)}</div>`;
  }

  // Technical skills
  if (s.show.skills && s.technicalSkills.length) {
    h+=`<hr class="cv-section-divider"><div class="cv-block"><div class="cv-sec-title">Technical skills</div><div class="cv-tech">${esc(dot(s.technicalSkills))}</div></div>`;
  }

  // Professional experience
  if (s.show.experience && s.experiences.length) {
    s.experiences.forEach((co,ci)=>{
      // Divider BETWEEN companies (not before the first one)
      if(ci>0) h+=`<hr class="cv-co-divider">`;

      (co.projects||[]).forEach((p,pi)=>{
        // Divider BETWEEN projects within same company (not before the first project)
        if(pi>0) h+=`<hr class="cv-proj-divider">`;

        h+=`<div class="cv-co-block">`;

        // Section title only on very first block so it stays glued to content
        if(ci===0 && pi===0){
          h+=`<hr class="cv-section-divider"><div class="cv-sec-title">Professional experience</div>`;
        }

        // Company name only on FIRST project of this company
        if(pi===0){
          h+=`<div class="cv-exp-row">
            <span class="cv-company">${esc(co.company)}</span>
            <span class="cv-date">${esc(p.dateRange)}</span>
          </div>`;
        } else {
          // Subsequent projects: date right-aligned, no company name
          h+=`<div style="text-align:right;margin-top:4pt;">
            <span class="cv-date">${esc(p.dateRange)}</span>
          </div>`;
        }

        h+=`<div class="cv-role">${esc(p.role)}</div>`;
        if(p.description){
          h+=`<div class="cv-sublabel">Project Description</div>
              <div class="cv-text" style="margin-bottom:10pt">${esc(p.description)}</div>`;
        }
        if(p.technologies.length){
          h+=`<div class="cv-block"><div class="cv-sublabel" style="margin-bottom:3pt">Technologies</div>
              <div class="cv-tech">${esc(dot(p.technologies))}</div></div>`;
        }
        const rs=(p.responsibilities||[]).filter(r=>r.trim());
        if(rs.length){
          h+=`<div class="cv-block"><div class="cv-sublabel" style="margin-bottom:3pt">Responsibilities</div>
              <ul class="cv-ul">`;
          rs.forEach(r=>{h+=`<li>${esc(r)}</li>`;});
          h+=`</ul></div>`;
        }
        h+=`</div>`;
      });
    });
  }

  // Education
  if (s.show.education && s.education.length) {
    h+=`<hr class="cv-section-divider"><div class="cv-block"><div class="cv-sec-title">Education</div>`;
    s.education.forEach(e=>{
      h+=`<div class="cv-institution">${esc(e.school)}</div>
          <div class="cv-period">${esc(e.period)}</div>
          <div class="cv-degree">${esc(e.degree)}</div>`;
    });
    h+=`</div>`;
  }

  // Certifications
  if (s.show.certifications && s.certifications.length) {
    h+=`<hr class="cv-section-divider"><div class="cv-block"><div class="cv-sec-title">Certification</div>`;
    s.certifications.forEach(c=>{
      h+=`<div class="cv-institution">${esc(c.certName)}</div>
          <div class="cv-year">${esc(c.year)}</div>`;
    });
    h+=`</div>`;
  }

  // Languages
  if (s.show.languages && s.languages.length) {
    h+=`<hr class="cv-section-divider"><div class="cv-block"><div class="cv-sec-title">Languages</div>`;
    s.languages.forEach(l=>{
      h+=`<div class="cv-lang-row"><span class="cv-lang-name">${esc(l.language)}:&nbsp;</span><span class="cv-lang-val">${esc(l.level)}</span></div>`;
    });
    h+=`</div>`;
  }

  h+=`</div>
  <div class="cv-ftr">
    <img src="${LOGO_SRC}" alt="SevenPro" style="height:18px;width:auto;">
    <div style="text-align:right;font-size:8pt;color:#888;line-height:1.6;">welcome@seven-pro.com<br>www.seven-pro.com</div>
  </div></div>`;
  document.getElementById('cvOut').innerHTML=h;
}

const ge=id=>document.getElementById(id);

function toggleCard(id){const b=ge(id+'_b'),a=ge(id+'_a');b.classList.toggle('open');if(a)a.classList.toggle('open');}

function mkCard(id,icon,ic,title,secKey,open,body){
  const d=document.createElement('div');d.className='card';
  const naBtn=secKey?`<button class="btn-na ${state.show[secKey]?'':'active'}" onclick="toggleSection('${secKey}',this);event.stopPropagation()">${state.show[secKey]?'N/A':'Hidden'}</button>`:'';
  d.innerHTML=`<div class="card-head" onclick="toggleCard('${id}')">
    <div class="ch-l"><div class="ch-icon ${ic}">${icon}</div><span class="ch-title">${title}</span></div>
    <div class="ch-right">${naBtn}<span class="ch-arr ${open?'open':''}" id="${id}_a">▼</span></div>
  </div>
  <div class="card-body ${open?'open':''}" id="${id}_b">${body}</div>`;
  if(secKey&&!state.show[secKey])d.classList.add('disabled');
  return d;
}

function toggleSection(key,btn){
  state.show[key]=!state.show[key];
  btn.textContent=state.show[key]?'N/A':'Hidden';
  btn.classList.toggle('active',!state.show[key]);
  btn.closest('.card').classList.toggle('disabled',!state.show[key]);
  schedulePreview();
}

// ─────────────────────────────────────────────────────────────────────────────
// TAG INPUT  (with paste support for bulk add)
// ─────────────────────────────────────────────────────────────────────────────
function mkTags(wrap,arr,onChange){
  wrap.innerHTML='';
  arr.forEach((t,i)=>{
    const s=document.createElement('span');s.className='tag';
    s.innerHTML=esc(t)+`<button class="tx" data-i="${i}">×</button>`;
    s.querySelector('.tx').onclick=ev=>{ev.stopPropagation();arr.splice(i,1);onChange(arr);mkTags(wrap,arr,onChange);};
    wrap.appendChild(s);
  });
  const inp=document.createElement('input');
  inp.className='tinp';inp.placeholder='Type & press Enter or ,';
  inp.onkeydown=ev=>{
    if((ev.key==='Enter'||ev.key===',')&&inp.value.trim()){
      ev.preventDefault();
      const v=inp.value.replace(/,$/,'').trim();
      if(v){inp.value='';arr.push(v);onChange(arr);mkTags(wrap,arr,onChange);}
    }
    if(ev.key==='Backspace'&&!inp.value&&arr.length){arr.pop();onChange(arr);mkTags(wrap,arr,onChange);}
  };
  // ← Paste multiple skills at once (comma/semicolon/newline separated)
  inp.onpaste=ev=>{
    ev.preventDefault();
    const text=(ev.clipboardData||window.clipboardData).getData('text');
    const items=text.split(/[,;\n\r\t]+/).map(s=>s.trim()).filter(s=>s&&!arr.includes(s));
    if(items.length){inp.value='';items.forEach(v=>arr.push(v));onChange(arr);mkTags(wrap,arr,onChange);}
  };
  inp.onblur=()=>{const v=inp.value.replace(/,$/,'').trim();if(v){arr.push(v);onChange(arr);mkTags(wrap,arr,onChange);}};
  wrap.appendChild(inp);
  wrap.onclick=()=>inp.focus();
}

function saveAccordions(){

function restoreAccordions(s){
  Object.keys(s).forEach(id=>{
    const el=ge(id);if(!el)return;
    el.classList.add('open');
    const arrId=id.replace(/^cb_/,'coarr_').replace(/^pb_/,'parr_');

}
